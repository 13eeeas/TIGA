# TIGA Hunt - Knowledge Corpus Mode profile

work_dir: ./tiga_work

index_roots:
  - "F:/Shared/Non Project Image/02 Talks Presentation Training Exhibitions/000 Out of Office Seminars"

include_globs:
  - "**/*"

exclude_globs:
  - "**/.git/**"
  - "**/~$*"
  - "**/*.tmp"
  - "**/node_modules/**"
  - "**/__pycache__/**"

max_file_mb: 2048

lane_rules:
  text_extractable_exts: [.pdf, .docx, .pptx, .txt, .md, .doc, .xlsx, .xls]
  metadata_only_exts: [.jpg, .jpeg, .png, .gif, .tif, .tiff, .bmp, .mp4, .mov, .avi, .mkv, .wmv, .dwg, .rvt, .ifc, .skp, .3dm]

corpus:
  mode: knowledge_corpus
  name: Out of Office Seminars
  description: Seminar, talk, presentation, training, and exhibition material.
  metadata_first: true
  contextual_chunk_headers: true
  chunk_max_chars: 3000
  chunk_overlap_chars: 250
  wiki_min_sources: 2

ollama:
  base_url: http://localhost:11434
  embed_model: nomic-embed-text
  chat_model: mistral
  timeout_seconds: 30
  gpu_layers: -1
  num_ctx: 4096
  embed_batch_size: 32
  embed_batch_sleep_s: 0.1

server:
  host: 0.0.0.0
  port: 7860
  workers: 2

ui:
  port: 8501
  title: TIGA Hunt
  max_session_history: 20

project_inference:
  enable: false
  confidence_threshold_unknown: 0.5
  patterns: []
  keyword_boosts: []

typology_inference:
  confidence_threshold_unknown: 0.5
  keyword_map: {}

retrieval:
  top_k_default: 5
  hybrid_weight_bm25: 0.4
  hybrid_weight_vector: 0.6
  candidate_pool_multiplier: 4
  reranker_enabled: false
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  reranker_top_k: 20

ocr:
  enabled: false
  tesseract_cmd: tesseract

einstein:
  enable: false
  base_model: mistral
  adapter_path: ./tiga_work/einstein/adapter

pipeline:
  extract_workers: 4
  fingerprint_strategy: sampled

scheduler:
  day_start_hour: 6
  night_start_hour: 22
  day_embed_batch_size: 16
  day_extract_workers: 2
  day_run_indexing: false
  night_embed_batch_size: 256
  night_extract_workers: 8
  night_run_indexing: true
