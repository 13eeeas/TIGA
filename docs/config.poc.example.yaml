# Gateway 1 POC — copy to tiga_work/config.yaml and edit index_roots
# API key: set TIGA_LLM_API_KEY or TIGA_OPENAI_API_KEY in environment (never commit keys)

work_dir: ./tiga_work

index_roots:
  - "Z:/PROJECT_A"
  - "Z:/PROJECT_B"
  - "Z:/PROJECT_C"

include_globs:
  - '**/*'
exclude_globs:
  - '**/.git/**'
  - '**/~$*'
  - '**/*.tmp'
  - '**/node_modules/**'
  - '**/__pycache__/**'
  - '**/Thumbs.db'
  - '**/desktop.ini'
  - '**/.DS_Store'
  - '**/*.bak'
  - '**/backup/**'
  - '**/Backup/**'
  - '**/_backup/**'
  - '**/temp/**'
  - '**/Temp/**'
  - '**/_temp/**'
  - '**/.tmp/**'

max_file_mb: 2048

lane_rules:
  text_extractable_exts:
    [.pdf, .docx, .doc, .pptx, .ppt, .txt, .md, .csv, .xlsx, .xls, .msg, .eml]
  metadata_only_exts:
    [.dwg, .dxf, .dwf, .dgn, .rvt, .rfa, .rte, .ifc, .nwd, .nwc,
     .skp, .3dm, .jpg, .jpeg, .png, .gif, .bmp, .tif, .tiff, .webp,
     .svg, .psd, .mp4, .mov, .avi, .wmv, .mkv, .m4v, .zip, .rar, .7z]

email:
  internal_domains: [woha.com]

extract:
  empty_fallback_metadata: true

dedupe:
  enabled: true

ollama:
  base_url: http://localhost:11434
  embed_model: nomic-embed-text
  chat_model: mistral
  timeout_seconds: 30
  num_ctx: 4096
  embed_batch_size: 16
  embed_batch_sleep_s: 0.15

server:
  host: 0.0.0.0
  port: 7860

retrieval:
  top_k_default: 10
  hybrid_weight_bm25: 0.4
  hybrid_weight_vector: 0.6
  prefer_latest_default: true
  latest_score_boost: 1.15
  superseded_score_penalty: 0.55
  reranker_enabled: true
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  reranker_top_k: 50
  reranker_chunk_chars: 1200
  # Google-classic Hunt signals (local, $0 API) — keep LLM evidence pack clean
  path_boost_enabled: true
  project_code_boost_enabled: true
  phrase_match_enabled: true
  domain_expand_enabled: true
  max_chunks_per_file: 2

field_collect:
  enabled: true
  max_results_logged: 10
  include_answer_preview: false

compose:
  provider: openai
  api_enabled: true
  model: gpt-4o-mini
  max_tokens: 800
  timeout_seconds: 45
  evidence_pack_size: 12
  chunk_char_cap: 1200
  fallback_to_ollama: true
  azure_endpoint: ""
  azure_deployment: ""
  azure_api_version: "2024-02-15-preview"

ocr:
  enabled: false
  on_empty_pdf: false

pipeline:
  extract_workers: 4
  fingerprint_strategy: sampled

scheduler:
  day_start_hour: 6
  night_start_hour: 22
  day_embed_batch_size: 16
  day_extract_workers: 2
  day_run_indexing: false
  night_embed_batch_size: 128
  night_extract_workers: 6
  night_run_indexing: true
