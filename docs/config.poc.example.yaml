# Gateway 1 POC — copy to tiga_work/config.yaml and edit index_roots
# API key: set TIGA_LLM_API_KEY or TIGA_OPENAI_API_KEY in environment (never commit keys)

work_dir: ./tiga_work

index_roots:
  - "Z:/PROJECT_A"
  - "Z:/PROJECT_B"
  - "Z:/PROJECT_C"

include_globs:
  - '**/*'
exclude_globs:
  - '**/.git/**'
  - '**/~$*'
  - '**/*.tmp'
  - '**/node_modules/**'
  - '**/__pycache__/**'
  - '**/backup/**'
  - '**/Backup/**'
  - '**/_backup/**'

max_file_mb: 2048

lane_rules:
  text_extractable_exts: [.pdf, .docx, .pptx, .txt, .md, .doc, .xlsx, .msg]
  metadata_only_exts: [.dwg, .rvt, .ifc, .skp, .3dm, .jpg, .jpeg, .png, .mp4]

ollama:
  base_url: http://localhost:11434
  embed_model: nomic-embed-text
  chat_model: mistral
  timeout_seconds: 30
  num_ctx: 4096
  embed_batch_size: 16
  embed_batch_sleep_s: 0.15

server:
  host: 0.0.0.0
  port: 7860

retrieval:
  top_k_default: 10
  hybrid_weight_bm25: 0.4
  hybrid_weight_vector: 0.6
  prefer_latest_default: true
  latest_score_boost: 1.15
  superseded_score_penalty: 0.55
  reranker_enabled: true
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  reranker_top_k: 50
  reranker_chunk_chars: 1200

compose:
  provider: openai
  api_enabled: true
  model: gpt-4o-mini
  max_tokens: 800
  timeout_seconds: 45
  evidence_pack_size: 12
  chunk_char_cap: 1200
  fallback_to_ollama: true
  azure_endpoint: ""
  azure_deployment: ""
  azure_api_version: "2024-02-15-preview"

ocr:
  enabled: false

pipeline:
  extract_workers: 4
  fingerprint_strategy: sampled

scheduler:
  day_start_hour: 6
  night_start_hour: 22
  day_embed_batch_size: 16
  day_extract_workers: 2
  day_run_indexing: false
  night_embed_batch_size: 128
  night_extract_workers: 6
  night_run_indexing: true
