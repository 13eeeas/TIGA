<svg class="tiga-cat-svg cat-svg" viewBox="0 0 56 84" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <!-- Flow cat — layered parts for animation (3/4 sitting pose) -->
  <g class="cat-body-group">

    <!-- TAIL -->
    <g class="cat-tail">
      <path d="M 14 52 C 5 50 1 42 4 32 C 6 26 10 28 12 34 C 14 40 15 48 14 52 Z" fill="#1C1917"/>
    </g>

    <!-- BODY + LEGS -->
    <g class="cat-legs">
      <path class="cat-body" d="
        M 27 35
        C 21 36 15 42 13 52
        C 11 62 13 72 20 77
        C 26 80 34 80 40 76
        C 46 72 46 62 43 52
        C 40 42 34 36 27 35
        Z" fill="#1C1917"/>
      <!-- back paw -->
      <ellipse class="cat-paw-back" cx="19" cy="76" rx="3.2" ry="2" fill="#1C1917"/>
    </g>

    <!-- FRONT ARM + PAW -->
    <g class="cat-arm">
      <path class="cat-arm-shape" d="M 34 48 C 38 52 40 62 39 72 C 38 76 36 77 34 74 C 33 68 32 58 34 48 Z" fill="#1C1917"/>
      <path class="cat-paw-front" d="M 37 74 C 40 77 43 77 45 74 C 46 72 44 70 41 71 Z" fill="#1C1917"/>
    </g>

    <!-- HEAD -->
    <g class="cat-head">
      <path class="cat-skull" d="
        M 29 13
        C 37 12 42 18 41 25
        C 40 31 36 36 31 37
        C 27 38 22 37 18 33
        C 14 29 13 23 15 18
        C 17 14 23 12 29 13
        Z" fill="#1C1917"/>

      <g class="cat-ears">
        <path class="cat-ear-l" d="M 16 17 L 12 3 L 24 19 Z" fill="#1C1917"/>
        <path class="cat-ear-r" d="M 40 15 L 44 2 L 36 18 Z" fill="#1C1917"/>
        <path class="cat-ear-inner-l" d="M 17 16 L 14.5 8 L 21 17.5 Z" fill="#C96442"/>
        <path class="cat-ear-inner-r" d="M 39 15 L 41.5 7 L 37 16.5 Z" fill="#C96442"/>
      </g>

      <g class="cat-face">
        <g class="cat-eyes">
          <g class="cat-eye-l">
            <ellipse cx="20.5" cy="27" rx="3.4" ry="3.9" fill="#E8B830"/>
            <circle class="cat-pupil-l" cx="21" cy="28" r="1.35" fill="#1C1917"/>
            <circle class="cat-eye-shine-l" cx="21.7" cy="25.8" r="0.7" fill="#FFF" opacity="0.9"/>
          </g>
          <g class="cat-eye-r">
            <ellipse cx="30" cy="26" rx="3.9" ry="4.4" fill="#E8B830"/>
            <circle class="cat-pupil-r" cx="30.5" cy="27.1" r="1.55" fill="#1C1917"/>
            <circle class="cat-eye-shine-r" cx="31.4" cy="24.6" r="0.8" fill="#FFF" opacity="0.9"/>
          </g>
        </g>
        <path class="cat-nose" d="M 25.5 32.5 L 23.2 36 Q 25.5 37.2 27.8 36 Z" fill="#E8928A"/>
        <path class="cat-mouth" d="M 25.5 37.2 Q 23.2 38.6 21.5 38" stroke="#1C1917" stroke-width="0.55" stroke-linecap="round" fill="none" opacity="0.4"/>
      </g>
    </g>

  </g>
</svg>
