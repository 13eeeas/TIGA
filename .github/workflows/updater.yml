# Synthetic updater tests only — no office corpus, no live WOHA host.
name: updater

on:
  push:
  pull_request:

jobs:
  isolated-temp-repos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Isolated temporary-repository updater tests
        run: python -m pytest tests/test_safe_update.py -q
